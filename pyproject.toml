[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xl2ai"
dynamic = ["version"]
description = "Local Excel-to-SQLite preparation platform for safe, traceable AI analysis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "Office Automation"}]
dependencies = [
  "pywin32>=306; platform_system == 'Windows'"
]

[project.scripts]
xl2ai = "xl2ai.cli:main"

[tool.setuptools.dynamic]
version = {attr = "xl2ai.__version__"}

[tool.setuptools.packages.find]
include = ["xl2ai*"]
